name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          VITE_PLATFORM_API_URL: ${{ vars.VITE_PLATFORM_API_URL || '' }}
          VITE_AI_API_URL: ${{ vars.VITE_AI_API_URL || '' }}
          VITE_FREE_CLOUD_URL: ${{ vars.VITE_FREE_CLOUD_URL || '' }}
          VITE_OWNER_EMAIL: ${{ vars.VITE_OWNER_EMAIL || 'Abdelrhman.maroxo@gmail.com' }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL || 'pathpilot.app00@gmail.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
